<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Game of Life - Visualització</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #eee;
        font-family: Arial;
    }

    #grid {
        display: grid;
        grid-template-columns: repeat(10, 20px);
        gap: 1px;
        background: #333;
        padding: 5px;
    }

    .cell {
        width: 20px;
        height: 20px;
        background: white;
    }

    .alive {
        background: black;
    }
</style>
</head>
<body>

<div id="grid"></div>

<script>
/* --- Generació aleatòria --- */
function crearArrayRandom(files, cols) {
    let arr = [];
    for (let i = 0; i < files; i++) {
        arr[i] = [];
        for (let j = 0; j < cols; j++) {
            if (i == 0 || i == files - 1 || j == 0 || j == cols - 1) {
                arr[i][j] = 0;
            } else {
                arr[i][j] = Math.floor(Math.random() * 2);
            }
        }
    }
    return arr;
}

/* --- Actualització (Game of Life) --- */
function actualitzarArray(files, cols, A1) {
    let arr = [];
    for (let i = 0; i < files; i++) {
        arr[i] = [];
        for (let j = 0; j < cols; j++) {
            if (i == 0 || i == files - 1 || j == 0 || j == cols - 1) {
                arr[i][j] = 0;
                continue;
            }

            let c = 0;
            c += A1[i - 1][j - 1];
            c += A1[i - 1][j];
            c += A1[i - 1][j + 1];
            c += A1[i][j - 1];
            c += A1[i][j + 1];
            c += A1[i + 1][j - 1];
            c += A1[i + 1][j];
            c += A1[i + 1][j + 1];

            if (c < 2 || c > 3) arr[i][j] = 0;
            else if (A1[i][j] == 0 && c == 3) arr[i][j] = 1;
            else arr[i][j] = A1[i][j];
        }
    }
    return arr;
}

/* --- Copiar matriu --- */
function copiar(A1, A2) {
    for (let i = 0; i < A2.length; i++) {
        A1[i] = [];
        for (let j = 0; j < A2[i].length; j++) {
            A1[i][j] = A2[i][j];
        }
    }
    return A1;
}

/* --- Dibuixar la graella --- */
function dibuixar(A) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    for (let i = 0; i < A.length; i++) {
        for (let j = 0; j < A[i].length; j++) {
            const div = document.createElement("div");
            div.className = "cell" + (A[i][j] === 1 ? " alive" : "");
            grid.appendChild(div);
        }
    }
}

/* --- Execució contínua --- */
let A1 = crearArrayRandom(10, 10);
dibuixar(A1);

setInterval(() => {
    let A2 = actualitzarArray(10, 10, A1);
    A1 = copiar(A1, A2);
    dibuixar(A1);
}, 300);

</script>
</body>
</html>
