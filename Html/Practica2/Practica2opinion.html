<body>

  <header>
    <h1>Dragon Ball Super: Broly</h1>
    <nav>
      <a href="Practica2Menu.html">Inici</a>
      <a href="Practica2Director.html">Director</a>
      <a href="Practica2Personajes.html">Personajes</a>
      <a href="Practica2CinemesStreaming.html">Cinemes/Streaming</a>
      <a href="Practica2opinion.html">Opinion</a>
      <a href="Practica2Media.html">Media</a>
      <a href="Practica2NDP.html">Niveles de Poder</a>
    </nav>
  </header>

  <main>
    <h1>Formulario de la película</h1>

    <form action="Practica2Menu.html" method="POST" id="formulari1">
      <label for="nombre">Nombre:</label>
      <input type="text" name="nombre" placeholder="Nombre" required />

      <label for="E-mail">E-mail:</label>
      <input type="text" name="E-mail" placeholder="ejemplo@gmail.com" required />

      <label>Personaje favorito:</label>
      <select name="PersonajeFav">
        <option value="Gogeta">Gogeta</option>
        <option value="Broly">Broly</option>
        <option value="Goku">Goku</option>
        <option value="Vegeta">Vegeta</option>
        <option value="Freezer">Freezer</option>
        <option value="Cheelai">Cheelai</option>
      </select>

      <label>Valoración:</label>
      <select name="valoracion">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>

      <label>Medio para verla:</label>
      <select name="MedioDeVer">
        <option value="Crunchyroll">Crunchyroll</option>
        <option value="Disney">Disney</option>
        <option value="AmazonPrimeVideo">Amazon Prime Video</option>
        <option value="AppleTV">Apple TV</option>
        <option value="Netflix">Netflix</option>
      </select>

      <label>Comentario personal:</label>
      <textarea name="comentario" placeholder="Escribe tu opinión sobre la película"></textarea>

      <input type="submit" value="Enviar" />
    </form>
  </main>

  <footer>
    <section>
      <p>Todo lo utilizado en este apartado es libre de derechos de autor</p>
    </section>
  </footer>

</body>
</html>
