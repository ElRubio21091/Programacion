<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Interstellar</title>

    <!-- Fuente externa -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        /* ESTILOS GENERALES */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        /* MENÚ DESPLEGABLE */
        nav ul {
            list-style: none;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        nav ul li {
            position: relative;
            padding: 15px 20px;
            cursor: pointer;
        }

        nav ul li:hover {
            background-color: #1abc9c;
        }

        /* SUBMENÚ */
        nav ul li ul {
            display: none;
            position: absolute;
            top: 50px;
            left: 0;
            background-color: black;
            padding: 0;
            width: 150px;
        }

        nav ul li:hover ul {
            display: block;
        }

        nav ul li ul li {
            padding: 10px;
        }

        /* FLEXBOX */
        .contenido {
            display: flex;
            justify-content: space-around;
            padding: 20px;
        }

        .caja {
            background-color: rgba(255,255,255,0.1);
            border: 2px solid white;
            border-radius: 10px;
            padding: 20px;
            width: 40%;
        }

        /* POSICIONAMIENTO CLÁSICO */
        .fija {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: #e74c3c;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Interstellar</h1>

    <!-- MENÚ -->
    <nav>
        <ul>
            <li>Inicio</li>
            <li>Película
                <ul>
                    <li>Sinopsis</li>
                    <li>Reparto</li>
                </ul>
            </li>
            <li>Contacto</li>
        </ul>
    </nav>

    <!-- CONTENIDO CON FLEXBOX -->
    <div class="contenido">
        <div class="caja">
            <h2>Sinopsis</h2>
            <p>Un grupo de astronautas viaja a través de un agujero de gusano.</p>
        </div>

        <div class="caja">
            <h2>Reparto</h2>
            <p>Matthew McConaughey, Anne Hathaway</p>
        </div>
    </div>

    <!-- POSITION FIXED -->
    <div class="fija">
        © 2026
    </div>

</body>
</html>
